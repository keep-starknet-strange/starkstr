[package]
name = "recursive_verifier"
version = "0.1.0"
edition = "2024_07"

[dependencies]
stwo_cairo_air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "f23b836909fdee27760bf5d7e7bf12110b7d562b" }
stwo_verifier_core = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "f23b836909fdee27760bf5d7e7bf12110b7d562b" }
cairo_execute = "2.11.4"

[executable]

[lib]

[profile.profiling]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true

[profile.proving]
inherits = "release"

[profile.proving.cairo]
enable-gas = false

[dev-dependencies]
cairo_test = "2.11.4"
